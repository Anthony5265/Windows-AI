<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Windows AI Installer</title>
  <style>
    :root {
      --background: #ffffff;
      --foreground: #000000;
    }
    body {
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
    }
    .message {
      max-width: 80%;
      margin-bottom: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
    }
    .message.user {
      align-self: flex-end;
      background: #0078d4;
      color: white;
    }
    .message.assistant {
      align-self: flex-start;
      background: #e5e5ea;
      color: black;
    }
    #input-bar {
      display: flex;
      padding: 0.5rem;
      border-top: 1px solid #ccc;
    }
    #input-bar input {
      flex: 1;
      padding: 0.5rem;
    }
    #theme-toggle {
      margin-left: 0.5rem;
    }
    @media (max-width: 600px) {
      .message { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function ChatApp() {
      const [messages] = useState([
        { role: 'assistant', content: 'Welcome to Windows AI Installer!' },
        { role: 'user', content: 'Install local models.' }
      ]);
      const [theme, setTheme] = useState({ name: 'light', background: '#ffffff', foreground: '#000000' });

      useEffect(() => {
        if (window.pywebview && window.pywebview.api) {
          window.pywebview.api.get_theme().then(setTheme);
        }
      }, []);

      useEffect(() => {
        const root = document.documentElement;
        root.style.setProperty('--background', theme.background);
        root.style.setProperty('--foreground', theme.foreground);
      }, [theme]);

      const toggleTheme = () => {
        const next = theme.name === 'dark' ? 'light' : 'dark';
        if (window.pywebview && window.pywebview.api) {
          window.pywebview.api.set_theme(next).then(setTheme);
        } else {
          setTheme(next === 'dark'
            ? { name: 'dark', background: '#000000', foreground: '#ffffff' }
            : { name: 'light', background: '#ffffff', foreground: '#000000' });
        }
      };

      return (
        <>
          <div id="chat-container">
            {messages.map((m, i) => (
              <div key={i} className={`message ${m.role}`}>{m.content}</div>
            ))}
          </div>
          <div id="input-bar">
            <input id="prompt" placeholder="Ask something..." />
            <button id="theme-toggle" onClick={toggleTheme}>Toggle Theme</button>
          </div>
        </>
      );
    }

    ReactDOM.render(<ChatApp />, document.getElementById('root'));
  </script>
</body>
</html>
