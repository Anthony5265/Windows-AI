[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode for async tests
asyncio_mode = auto

# Additional options
addopts =
    # Coverage reporting
    --cov=windows_ai
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80

    # Verbose output
    -v

    # Show extra test summary info
    -ra

    # Show local variables in tracebacks
    --showlocals

    # Strict markers
    --strict-markers

# Custom markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (require backend services)
    e2e: End-to-end tests (require full app)
    slow: Slow tests (> 1 second)
    benchmark: Performance benchmark tests

# Minimum Python version
minversion = 3.9

# Test output options
console_output_style = progress
junit_family = xunit2

# Ignore paths
norecursedirs = .git .tox dist build *.egg node_modules

