name: CI (Windows PowerShell)on:  pull_request:  workflow_dispatch:jobs:  ps_analyze_and_smoke:    runs-on: windows-latest    steps:      - uses: actions/checkout@v4      - name: Install PSScriptAnalyzer        shell: pwsh        run: |          Set-PSRepository PSGallery -InstallationPolicy Trusted          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force      - name: Lint PowerShell scripts        shell: pwsh        run: |          Invoke-ScriptAnalyzer -Path install -Recurse -Severity Error -EnableExit      - name: Smoke: parse installer scripts (no side-effects)        shell: pwsh        run: |          $PSCmdlet = $null          Write-Host "Verifying script loads without runtime errors..."          .\install\install.ps1 -ServiceName TEST -ServiceExe 'cmd /c echo hi'  *> $null          .\install\uninstall.ps1 -ServiceName TEST  *> $null          Write-Host "OK"