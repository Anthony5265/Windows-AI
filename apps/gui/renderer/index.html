<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>Windows AI — Command Center</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header><h1>Windows AI</h1>
<nav>
  <button data-tab="chat">Chat</button>
  <button data-tab="workflows">Workflows</button>
  <button data-tab="settings">Settings</button>
</nav></header>
<main>
<section id="chat" class="tab active">
  <div id="chat-log"></div>
</section>
<section id="workflows" class="tab">
  <button id="runEcho">Run sample echo</button>
  <pre id="wfOut"></pre>
</section>
<section id="settings" class="tab">
  <label>Theme <select id="theme"><option>system</option><option>light</option><option>dark</option></select></label>
  <label>Bind <input id="bind" value="127.0.0.1"/></label>
  <button id="saveCfg">Save</button>
</section>
</main>
<footer><span id="env"></span></footer>
<script src="./renderer.js"></script>
</body></html>
