name: GPT Requestdescription: Send prompt and file contents to OpenAI APIinputs:  prompt:    description: Prompt to prefix to file contents    required: true  model:    description: Model to use    required: false    default: gpt-4.1-nano  file_path:    description: Path to file whose contents will be appended to the prompt    required: trueruns:  using: composite  steps:    - run: node $GITHUB_ACTION_PATH/index.js      shell: bash      env:        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # gpt-5-nano default        PROMPT: ${{ inputs.prompt }}        MODEL: ${{ inputs.model }}        FILE_PATH: ${{ inputs.file_path }}