name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
categories:
  - title: '🚀 Features'
    labels:
      - enhancement
      - feature
  - title: '🐛 Bug Fixes'
    labels:
      - bug
  - title: '📝 Documentation'
    labels:
      - documentation
      - docs
  - title: '🏠 Maintenance'
    labels:
      - chore
      - refactor
template: |
  ## What's Changed
  $CHANGES
  ## Contributors
  $CONTRIBUTORS
no-empty-release: true
