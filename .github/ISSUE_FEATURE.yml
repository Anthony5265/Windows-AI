name: Feature request
description: Propose a product or developer-platform improvement for Windows-AI.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature requests should describe a real problem, the desired outcome, and observable completion criteria. Check the canonical `AI_BLUEPRINT.md` before proposing work that changes project architecture or direction.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal / user story
      description: Describe the desired outcome from the user's perspective.
      placeholder: As a user, I want... so that...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior without assuming an implementation unless implementation details are important.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that define completion. Formal testing belongs to the final validation phase, not active feature development.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds have you considered?

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I have searched for an existing feature request describing the same idea.
          required: true
        - label: I have checked the canonical AI_BLUEPRINT.md for conflicts with this proposal.
          required: true
        - label: I have not included passwords, API keys, tokens, or other secrets.
          required: true
