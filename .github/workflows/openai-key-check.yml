name: OpenAI Key Checkon:  workflow_dispatch:jobs:  verify:    runs-on: ubuntu-latest    steps:      - name: Test OpenAI API key        env:          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # gpt-5-nano default        run: |          curl --fail -sS -X POST https://api.openai.com/v1/responses \            -H "Content-Type: application/json" \            -H "Authorization: Bearer ${OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # gpt-5-nano default            -d '{"model":"gpt-4.1-nano","input":"ping"}' > /dev/null