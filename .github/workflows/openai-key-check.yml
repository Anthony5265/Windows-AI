name: openai-key-check
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Verify key (no secret leak)
        shell: bash
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "EMPTY"; exit 1
          fi
          echo "OPENAI_API_KEY length: ${#OPENAI_API_KEY}"
