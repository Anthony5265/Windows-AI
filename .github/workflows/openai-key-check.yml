name: OpenAI Key Check
on:
  workflow_dispatch: null
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - name: Test OpenAI API key
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: "curl --fail -sS -X POST https://api.openai.com/v1/responses \\\n  -H \"\
        Content-Type: application/json\" \\\n  -H \"Authorization: Bearer ${OPENAI_API_KEY}\"\
        \ \\\n  -d '{\"model\":\"gpt-4.1-nano\",\"input\":\"ping\"}' > /dev/null\n"
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
