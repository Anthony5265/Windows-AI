name: PR Merge Conflict Check
on:
  pull_request:
    branches:
    - main
  workflow_dispatch: null
jobs:
  merge-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Attempt merge with main
      id: merge
      continue-on-error: true
      run: 'git fetch origin main

        git merge --no-commit origin/main

        '
    - name: Comment on conflicts
      if: steps.merge.outcome == 'failure'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: "const {owner, repo} = context.repo;\nconst issue_number = context.issue.number;\n\
          const body = '\u26A0\uFE0F Merge conflicts detected when merging `main`\
          \ into this branch. Please resolve conflicts.';\nawait github.rest.issues.createComment({owner,\
          \ repo, issue_number, body});\n"
    - name: Fail on conflict
      if: steps.merge.outcome == 'failure'
      run: exit 1
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
