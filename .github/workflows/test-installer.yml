name: Test Installer

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout requests

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-0.5.0
          path: dist/
        continue-on-error: true

      - name: Run installer tests
        run: |
          pytest tests/installer/test_install.py -v --timeout=600
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            *.log
          retention-days: 7

  test-upgrade:
    name: Test Upgrade Path
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout

      - name: Run upgrade tests
        run: |
          pytest tests/installer/test_upgrade.py -v --timeout=1200
        continue-on-error: true

  test-rollback:
    name: Test Rollback
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio

      - name: Run rollback tests
        run: |
          pytest tests/installer/test_rollback.py -v
        continue-on-error: true

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, test-upgrade, test-rollback]
    if: always()

    steps:
      - name: Test summary
        run: |
          echo "### Test Results :test_tube:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Installation Tests**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Upgrade Tests**: ${{ needs.test-upgrade.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Rollback Tests**: ${{ needs.test-rollback.result }}" >> $GITHUB_STEP_SUMMARY
