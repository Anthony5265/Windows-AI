name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.5.0)'
        required: true
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: 'false'

jobs:
  build-release:
    name: Build Release Installer
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install NSIS
        run: choco install nsis -y

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $version = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $version = "0.5.0"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Release version: $version"

      - name: Build installer
        shell: pwsh
        run: |
          .\install\build-installer.ps1 -DownloadRuntimes -Version "${{ steps.version.outputs.VERSION }}"

      - name: Sign installer
        shell: pwsh
        run: |
          if ("${{ secrets.SIGNING_CERT_BASE64 }}" -ne "") {
            # Decode certificate
            $cert = [Convert]::FromBase64String('${{ secrets.SIGNING_CERT_BASE64 }}')
            [IO.File]::WriteAllBytes('cert.pfx', $cert)

            # Sign
            .\install\signing\sign-installer.ps1 `
              -InstallerPath "dist\WindowsAI-Setup-${{ steps.version.outputs.VERSION }}.exe" `
              -CertificatePath "cert.pfx" `
              -CertificatePassword "${{ secrets.SIGNING_CERT_PASSWORD }}"

            # Clean up
            Remove-Item cert.pfx -Force

            Write-Host "Installer signed successfully"
          } else {
            Write-Warning "No signing certificate configured"
          }
        continue-on-error: true

      - name: Calculate checksums and create manifest
        shell: pwsh
        working-directory: dist
        run: |
          $installerFile = "WindowsAI-Setup-${{ steps.version.outputs.VERSION }}.exe"

          if (-not (Test-Path $installerFile)) {
            Write-Error "Installer not found: $installerFile"
            exit 1
          }

          # Calculate checksums
          $sha256 = (Get-FileHash $installerFile -Algorithm SHA256).Hash
          $md5 = (Get-FileHash $installerFile -Algorithm MD5).Hash
          $size = (Get-Item $installerFile).Length

          # Create checksums file
          @"
          SHA-256: $sha256
          MD5: $md5
          Size: $size bytes
          "@ | Out-File -FilePath "$installerFile.checksums.txt"

          # Create release info JSON
          $releaseInfo = @{
            version = "${{ steps.version.outputs.VERSION }}"
            releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            fileName = $installerFile
            sha256 = $sha256
            md5 = $md5
            size = $size
          } | ConvertTo-Json -Depth 10

          $releaseInfo | Out-File -FilePath "release-info.json"

          Write-Host "Checksums calculated and release info created"

      - name: Generate changelog
        id: changelog
        shell: pwsh
        run: |
          # This would typically parse git commits or CHANGELOG.md
          # For now, we'll create a simple changelog
          $changelog = @"
          ## What's New in v${{ steps.version.outputs.VERSION }}

          ### Features
          - Complete installer hardening and code signing
          - Auto-update system with version management
          - Rollback functionality with system snapshots
          - Automated testing infrastructure
          - CI/CD pipeline with GitHub Actions

          ### Improvements
          - Enhanced security with digital signatures
          - Improved update experience
          - Better error handling and recovery

          ### Installation
          Download and run the installer. No additional dependencies required.

          ### Notes
          - Windows 10 or later (64-bit) required
          - Administrator privileges required for installation
          - Auto-update is enabled by default
          "@

          # Save to file
          $changelog | Out-File -FilePath "RELEASE_NOTES.md"

          # Output for GitHub release (escape for JSON)
          $changelogEscaped = $changelog -replace "`n", "\n" -replace "`r", ""
          echo "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
          echo "$changelog" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          release_name: Windows AI v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}

      - name: Upload installer to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/WindowsAI-Setup-${{ steps.version.outputs.VERSION }}.exe
          asset_name: WindowsAI-Setup-${{ steps.version.outputs.VERSION }}.exe
          asset_content_type: application/octet-stream

      - name: Upload checksums to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/WindowsAI-Setup-${{ steps.version.outputs.VERSION }}.exe.checksums.txt
          asset_name: WindowsAI-Setup-${{ steps.version.outputs.VERSION }}.exe.checksums.txt
          asset_content_type: text/plain

      - name: Upload release info
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/release-info.json
          asset_name: release-info.json
          asset_content_type: application/json

  update-manifest:
    name: Update Release Manifest
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Checkout update server repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: update-server
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Update manifest
        shell: bash
        run: |
          echo "Would update manifest.json with new release"
          echo "Version: ${{ needs.build-release.outputs.version }}"
          # This would add the new release to manifest.json
          # Implementation depends on update server setup

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [build-release, update-manifest]
    if: always()

    steps:
      - name: Release summary
        run: |
          echo "### Release Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${{ needs.build-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release has been published to GitHub Releases." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.build-release.outputs.version }})" >> $GITHUB_STEP_SUMMARY
