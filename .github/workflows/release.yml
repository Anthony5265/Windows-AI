name: Release
on:
  push:
    branches:
    - main
  workflow_dispatch: null
jobs:
  semantic-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm i
    - run: npx semantic-release || echo "semantic-release not configured"
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
