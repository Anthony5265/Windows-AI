name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example, 0.5.0)
        required: true
      prerelease:
        description: Is this a pre-release?
        required: false
        default: 'false'

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-release:
    name: Build Release Installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install NSIS
        run: choco install nsis -y

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $version = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $version = "0.5.0"
          }
          "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

      # Release-time validation is intentionally kept here because the project
      # reserves comprehensive validation for the final release phase.
      - name: Validate provider setup preflight
        shell: pwsh
        run: |
          $providerSetupPath = Join-Path $env:RUNNER_TEMP "provider-setup.json"
          .\install\run-provider-preflight.ps1 -OutputPath $providerSetupPath
          .\install\validate-provider-setup.ps1 -SetupPlanPath $providerSetupPath

      - name: Build installer
        shell: pwsh
        run: |
          .\install\build-installer.ps1 -DownloadRuntimes -Version "${{ steps.version.outputs.VERSION }}"

      - name: Sign installer when configured
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if ($env:SIGNING_CERT_BASE64) {
            $cert = [Convert]::FromBase64String($env:SIGNING_CERT_BASE64)
            [IO.File]::WriteAllBytes('cert.pfx', $cert)
            try {
              .\install\signing\sign-installer.ps1 `
                -InstallerPath "dist\WindowsAI-Setup-${{ steps.version.outputs.VERSION }}.exe" `
                -CertificatePath "cert.pfx" `
                -CertificatePassword $env:SIGNING_CERT_PASSWORD
            } finally {
              Remove-Item cert.pfx -Force -ErrorAction SilentlyContinue
            }
          } else {
            Write-Warning "No signing certificate configured"
          }
        continue-on-error: true

      - name: Calculate checksum and create manifests
        shell: pwsh
        working-directory: dist
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $installerFile = "WindowsAI-Setup-$version.exe"
          $repo = "${{ github.repository }}"
          $releaseTag = "v$version"
          $releaseUrl = "https://github.com/$repo/releases/tag/$releaseTag"
          $downloadUrl = "https://github.com/$repo/releases/download/$releaseTag/$installerFile"

          if (-not (Test-Path $installerFile)) {
            Write-Error "Installer not found: $installerFile"
            exit 1
          }

          $sha256 = (Get-FileHash $installerFile -Algorithm SHA256).Hash
          $size = (Get-Item $installerFile).Length
          $releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $isPrerelease = "${{ github.event.inputs.prerelease }}" -eq "true"

          "SHA-256: $sha256`nSize: $size bytes`nDownload: $downloadUrl" |
            Out-File -FilePath "$installerFile.checksums.txt" -Encoding utf8

          $releaseInfo = [ordered]@{
            version = $version
            releaseDate = $releaseDate
            fileName = $installerFile
            downloadUrl = $downloadUrl
            releaseUrl = $releaseUrl
            sha256 = $sha256
            size = $size
            prerelease = $isPrerelease
          }
          $releaseInfo | ConvertTo-Json -Depth 10 | Out-File -FilePath "release-info.json" -Encoding utf8

          [ordered]@{
            current_version = $version
            latest = $releaseInfo
            generated_at = $releaseDate
          } | ConvertTo-Json -Depth 10 | Out-File -FilePath "latest-release.json" -Encoding utf8

      - name: Generate release notes
        id: changelog
        shell: pwsh
        run: |
          $changelog = @"
          ## Windows-AI v${{ steps.version.outputs.VERSION }}

          ### Release
          - Production Windows installer
          - Digital signing when configured
          - Auto-update and rollback support
          - Provider setup preflight validation
          - Hardware-aware provider setup

          ### Installation
          Download and run the Windows installer. Follow the setup prompts to configure Windows-AI and its providers.

          ### Requirements
          - Windows 10 or later (64-bit)
          - Administrator privileges may be required for installation
          "@

          $changelog | Out-File -FilePath "RELEASE_NOTES.md" -Encoding utf8
          "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
          $changelog >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          release_name: Windows-AI v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}

      - name: Upload installer to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/WindowsAI-Setup-${{ steps.version.outputs.VERSION }}.exe
          asset_name: WindowsAI-Setup-${{ steps.version.outputs.VERSION }}.exe
          asset_content_type: application/octet-stream

      - name: Upload checksum to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/WindowsAI-Setup-${{ steps.version.outputs.VERSION }}.exe.checksums.txt
          asset_name: WindowsAI-Setup-${{ steps.version.outputs.VERSION }}.exe.checksums.txt
          asset_content_type: text/plain

      - name: Upload release info
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/release-info.json
          asset_name: release-info.json
          asset_content_type: application/json

      - name: Upload latest release manifest
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/latest-release.json
          asset_name: latest-release.json
          asset_content_type: application/json

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: build-release
    if: always()
    steps:
      - name: Release summary
        run: |
          echo "### Release Complete :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version**: v${{ needs.build-release.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag**: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Release has been published to GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
