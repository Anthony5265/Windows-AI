name: CI (Python + Node)

on:
  push:
    branches: [ main, work, develop ]
  pull_request:
    branches: [ main, work, develop ]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q

  node_actions_api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/actions-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'apps/actions-api/package-lock.json'
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm test
