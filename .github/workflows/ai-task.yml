name: ai-task
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Instruction for the model"
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Run OpenAI task
        run: |
          npm i openai@^4 --silent
          node - <<'NODE'
          const fs = require('fs');
          const OpenAI = require('openai');
          const client = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });
          (async () => {
            const prompt = process.env.INPUT_PROMPT || '';
            const r = await client.responses.create({ model: "gpt-4.1-mini", input: prompt });
            const out = r.output_text ?? JSON.stringify(r,null,2);
            fs.writeFileSync("ai-task.txt", out);
            console.log(out);
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE
        env:
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
      - uses: actions/upload-artifact@v4
        with: { name: ai-task, path: ai-task.txt }
