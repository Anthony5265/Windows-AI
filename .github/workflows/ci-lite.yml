name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for requirements.txt
        id: has-reqs
        run: |
          if [ -f requirements.txt ]; then
            echo "has_reqs=true" >> $GITHUB_OUTPUT
          else
            echo "has_reqs=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.has-reqs.outputs.has_reqs == 'true'
        with:
          python-version: '3.11'

      - name: Install Python deps
        if: steps.has-reqs.outputs.has_reqs == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
          python -m compileall -q .

  node:
    name: Node/Electron sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Root package.json install/build (if present)
        run: |
          if [ -f package.json ]; then
            (npm ci || npm install)
            npm run build --if-present
          fi

      - name: Install/build for nested package.json (if present)
        run: |
          set -e
          PKGS="$(git ls-files */package.json | grep -v node_modules || true)"
          for f in $PKGS; do
            d="$(dirname "$f")"
            echo "Processing $d"
            (cd "$d" && (npm ci || npm install) && npm run build --if-present)
          done
