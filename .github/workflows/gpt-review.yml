name: GPT Reviewon:  workflow_dispatch:  pull_request:    types: [opened, synchronize]jobs:  code-review:    runs-on: ubuntu-latest    steps:      - uses: actions/checkout@v4      - name: ChatGPT Code Review        uses: anc95/ChatGPT-CodeReview@v1.0.22        env:          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
