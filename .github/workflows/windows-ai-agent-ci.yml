name: windows-ai-agent-ci
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: windows-ai-agent
        run: npm ci || npm install
      - name: Run smoke tests
        working-directory: windows-ai-agent
        run: npm test
      - name: Package agent
        shell: pwsh
        run: |
          Compress-Archive -Path windows-ai-agent\* -DestinationPath windows-ai-agent.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-ai-agent
          path: windows-ai-agent.zip
