name: daily-ai-summary
on:
  schedule: [{ cron: "0 23 * * *" }]
  workflow_dispatch:
jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Prepare inputs
        run: |
          mkdir -p docs/chatgpt-session-log
          git log --since="24 hours ago" --pretty=format:"%h %ad %an %s" --date=iso > changes.txt || true
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Summarize with OpenAI
        run: |
          npm i openai@^4 --silent
          node - <<'NODE'
          const fs = require('fs');
          const OpenAI = require('openai');
          const client = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });
          const log = fs.readFileSync('changes.txt','utf8') || 'No changes.';
          (async()=>{
            const r = await client.responses.create({
              model:"gpt-4.1-mini",
              input:`Summarize today's repo activity and produce a concise changelog with sections and next actions:\n\n${log}`
            });
            const out = r.output_text ?? 'No output';
            const ts = new Date().toISOString().replace(/[:.]/g,'-');
            const year = ts.slice(0,4);
            const dir = `docs/chatgpt-session-log/${year}`;
            require('fs').mkdirSync(dir,{recursive:true});
            const file = `${dir}/${ts}--daily-ai-summary.md`;
            fs.writeFileSync(file, `# Daily AI Summary\\n\\n${out}\\n`);
            console.log(file);
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE
      - name: Commit summary
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/chatgpt-session-log
          git commit -m "docs(chatlog): add daily AI summary" || echo "no changes"
          git push
