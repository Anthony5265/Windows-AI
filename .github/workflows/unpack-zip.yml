name: Unpack repo zip
on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: Path to zip in repo
        required: true
        default: WindowsAI_full_1_18.zip
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          unzip -o "${{ github.event.inputs.zip_path }}" -d .
          rm -f "${{ github.event.inputs.zip_path }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack ${{ github.event.inputs.zip_path }} and remove archive" || echo "nothing to commit"
          git push
