name: Auto Rebase
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.prs.outputs.result }}
    steps:
      - id: prs
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            return data.map(pr => pr.number);
          result-encoding: json

  rebase:
    needs: list
    if: ${{ needs.list.outputs.prs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.list.outputs.prs) }}
    steps:
      - name: Rebase PR
        id: rebase
        uses: repo-sync/rebase@v2
        with:
          github_token: ${{ secrets.AUTO_REBASE_TOKEN }}
          pr: ${{ matrix.pr }}
        continue-on-error: true

      - name: Log success
        if: steps.rebase.outcome == 'success'
        run: echo "Rebased PR #${{ matrix.pr }} successfully"

      - name: Comment on failure
        if: steps.rebase.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ matrix.pr }},
              body: '⚠️ Automatic rebase failed. Please rebase manually.'
            });
