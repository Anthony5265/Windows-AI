name: Auto Rebase
on:
  push:
    branches:
    - main
  workflow_dispatch: null
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.prs.outputs.result }}
    steps:
    - id: prs
      uses: actions/github-script@v7
      with:
        script: "const { data } = await github.rest.pulls.list({\n  owner: context.repo.owner,\n\
          \  repo: context.repo.repo,\n  state: 'open',\n});\nreturn data.map(pr =>\
          \ pr.number);\n"
        result-encoding: json
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  rebase:
    needs: list
    if: ${{ needs.list.outputs.prs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.list.outputs.prs) }}
    steps:
    - name: Rebase PR
      id: rebase
      uses: repo-sync/rebase@v2
      with:
        github_token: ${{ secrets.AUTO_REBASE_TOKEN }}
        pr: ${{ matrix.pr }}
      continue-on-error: true
    - name: Log success
      if: steps.rebase.outcome == 'success'
      run: echo "Rebased PR
    - name: Comment on failure
      if: steps.rebase.outcome != 'success'
      uses: actions/github-script@v7
      with:
        script: "github.rest.issues.createComment({\n  owner: context.repo.owner,\n\
          \  repo: context.repo.repo,\n  issue_number: ${{ matrix.pr }},\n  body:\
          \ '\u26A0\uFE0F Automatic rebase failed. Please rebase manually.'\n});\n"
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
