name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:`n  test:`n    env:`n      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} 
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: 
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest

