name: pr-ai-review
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Compute diff
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}":base
          git diff --unified=0 --no-color base...HEAD > pr.diff || true
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Generate review with OpenAI
        run: |
          npm i openai@^4 --silent
          node - <<'NODE'
          const fs = require('fs');
          const OpenAI = require('openai');
          const client = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });
          const diff = fs.readFileSync('pr.diff','utf8').slice(0,300000);
          const prompt = `You are a senior Windows/Node reviewer. Review this unified diff for bugs, security, correctness, and clarity. Output crisp bullets with code blocks and file:line references.\n\n`+diff;
          (async()=>{
            const r = await client.responses.create({ model:"gpt-4.1-mini", input: prompt });
            fs.writeFileSync("review.md", r.output_text ?? "No output");
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md','utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
