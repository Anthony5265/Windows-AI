name: CI (Python + Node)on:  push:  pull_request:  workflow_dispatch:jobs:  build:    runs-on: windows-latest    steps:      - uses: actions/checkout@v4      # Setup Node with npm cache      - uses: actions/setup-node@v4        with:          node-version: 20          cache: 'npm'          cache-dependency-path: '**/package-lock.json'      # Setup Python      - uses: actions/setup-python@v5        with:          python-version: '3.11'      - name: Install Node deps        run: npm ci      - name: Install Python deps        run: pip install -r requirements.txt      - name: Install test deps        run: pip install pytest      # Optional commitlint step (disabled until config is added)      # - name: Lint commit messages      #   run: npx commitlint --from HEAD~1 --to HEAD      - name: Run tests        run: pytest -q      - name: Build installers        shell: pwsh        run: |          ./build_installer.ps1          if (-not (Test-Path 'dist_x86/WindowsAI_Installer_x86.exe')) { throw 'x86 build failed' }          if (-not (Test-Path 'dist_x64/WindowsAI_Installer_x64.exe')) { throw 'x64 build failed' }
