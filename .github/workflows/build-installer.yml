name: Build Installer

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: false
        default: ''

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            apps/gui/package-lock.json
            windows-ai-tray/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Install NSIS
        run: choco install nsis -y

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "0.5.0"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Building version: $version"

      - name: Run Python tests
        run: |
          pytest tests/ -v --cov=windows_ai --cov-report=xml
        continue-on-error: true

      - name: Build GUI application
        working-directory: apps/gui
        run: |
          npm install
          npm run build

      - name: Build Tray application
        working-directory: windows-ai-tray
        run: |
          npm install
          npm run build

      - name: Download Python runtime
        shell: pwsh
        run: |
          .\install\build-installer.ps1 -DownloadRuntimes -SkipTests -Version "${{ steps.version.outputs.VERSION }}"
        continue-on-error: false

      - name: Build installer
        shell: pwsh
        run: |
          $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsisPath)) {
            Write-Error "NSIS not found"
            exit 1
          }

          & $nsisPath /V4 install\installer.nsi

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Installer build failed"
            exit 1
          }

      - name: Sign installer (if certificate available)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        run: |
          # Decode certificate from secret
          if ("${{ secrets.SIGNING_CERT_BASE64 }}" -ne "") {
            $cert = [Convert]::FromBase64String('${{ secrets.SIGNING_CERT_BASE64 }}')
            [IO.File]::WriteAllBytes('cert.pfx', $cert)

            # Sign installer
            .\install\signing\sign-installer.ps1 `
              -InstallerPath "WindowsAI-Setup-${{ steps.version.outputs.VERSION }}.exe" `
              -CertificatePath "cert.pfx" `
              -CertificatePassword "${{ secrets.SIGNING_CERT_PASSWORD }}"

            # Clean up certificate
            Remove-Item cert.pfx -Force
          } else {
            Write-Host "No signing certificate configured, skipping signing"
          }
        continue-on-error: true

      - name: Move installer to dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $installerFile = "WindowsAI-Setup-${{ steps.version.outputs.VERSION }}.exe"
          if (Test-Path $installerFile) {
            Move-Item $installerFile dist/ -Force
          }

      - name: Calculate checksums
        shell: pwsh
        working-directory: dist
        run: |
          $installerFile = "WindowsAI-Setup-${{ steps.version.outputs.VERSION }}.exe"
          if (Test-Path $installerFile) {
            $sha256 = (Get-FileHash $installerFile -Algorithm SHA256).Hash
            $md5 = (Get-FileHash $installerFile -Algorithm MD5).Hash

            @"
            SHA-256: $sha256
            MD5: $md5
            "@ | Out-File -FilePath "$installerFile.checksums.txt"

            Write-Host "Checksums calculated:"
            Write-Host "SHA-256: $sha256"
            Write-Host "MD5: $md5"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ steps.version.outputs.VERSION }}
          path: |
            dist/WindowsAI-Setup-*.exe
            dist/WindowsAI-Setup-*.exe.checksums.txt
          retention-days: 30

      - name: Upload test coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  build-info:
    name: Build Information
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Build summary
        run: |
          echo "### Build Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Installer artifact has been uploaded and is available for download." >> $GITHUB_STEP_SUMMARY
