name: Build Installer

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build
        required: false
        default: ''

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            apps/gui/package-lock.json
            windows-ai-tray/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install NSIS
        run: choco install nsis -y

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "0.5.0"
          }
          "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $version"

      - name: Build GUI application
        working-directory: apps/gui
        run: |
          npm ci
          npm run build

      - name: Build Tray application
        working-directory: windows-ai-tray
        run: |
          npm ci
          npm run build

      - name: Download Python runtime
        shell: pwsh
        run: |
          .\install\build-installer.ps1 -DownloadRuntimes -SkipTests -Version "${{ steps.version.outputs.VERSION }}"

      - name: Build installer
        shell: pwsh
        run: |
          $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsisPath)) {
            Write-Error "NSIS not found"
            exit 1
          }
          & $nsisPath /V4 install\installer.nsi
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Installer build failed"
            exit 1
          }

      - name: Sign installer when configured
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if ($env:SIGNING_CERT_BASE64) {
            $cert = [Convert]::FromBase64String($env:SIGNING_CERT_BASE64)
            [IO.File]::WriteAllBytes('cert.pfx', $cert)
            try {
              .\install\signing\sign-installer.ps1 `
                -InstallerPath "WindowsAI-Setup-${{ steps.version.outputs.VERSION }}.exe" `
                -CertificatePath "cert.pfx" `
                -CertificatePassword $env:SIGNING_CERT_PASSWORD
            } finally {
              Remove-Item cert.pfx -Force -ErrorAction SilentlyContinue
            }
          } else {
            Write-Host "No signing certificate configured; skipping signing."
          }

      - name: Move installer to dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $installerFile = "WindowsAI-Setup-${{ steps.version.outputs.VERSION }}.exe"
          if (-not (Test-Path $installerFile)) {
            Write-Error "Expected installer was not produced: $installerFile"
            exit 1
          }
          Move-Item $installerFile dist/ -Force

      - name: Calculate SHA-256 checksum
        shell: pwsh
        working-directory: dist
        run: |
          $installerFile = "WindowsAI-Setup-${{ steps.version.outputs.VERSION }}.exe"
          $sha256 = (Get-FileHash $installerFile -Algorithm SHA256).Hash
          "SHA-256: $sha256" | Out-File -FilePath "$installerFile.checksums.txt" -Encoding utf8
          Write-Host "SHA-256: $sha256"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ steps.version.outputs.VERSION }}
          path: |
            dist/WindowsAI-Setup-*.exe
            dist/WindowsAI-Setup-*.exe.checksums.txt
          retention-days: 30

  build-info:
    name: Build Information
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Build summary
        run: |
          echo "### Build Complete :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version**: ${{ needs.build.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch**: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit**: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Installer artifact has been uploaded and is available for download." >> "$GITHUB_STEP_SUMMARY"
