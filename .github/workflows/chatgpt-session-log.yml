name: chatgpt-session-log
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Log title"
        required: true
      content_b64:
        description: "Markdown content (base64-encoded UTF-8)"
        required: true
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode & write file
        env:
          B64: ${{ github.event.inputs.content_b64 }}
        run: |
          set -eu
          ts="$(date -u +'%Y-%m-%d--%H%M%S-UTC')"
          year="${ts:0:4}"
          dir="docs/chatgpt-session-log/$year"
          mkdir -p "$dir"
          safe="$(echo "${{ github.event.inputs.title }}" | tr -cs 'A-Za-z0-9._- ' '-' | sed 's/^-*//;s/-*$//;s/ \{1,\}/-/g')"
          file="$dir/${ts}--${safe}.md"
          printf '# %s\n\n' "${{ github.event.inputs.title }}" > "$file"
          printf "%s" "$B64" | base64 -d >> "$file"
      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/chatgpt-session-log
          git commit -m "docs(chatlog): add ${{ github.event.inputs.title }}" || echo "no changes"
          git push
