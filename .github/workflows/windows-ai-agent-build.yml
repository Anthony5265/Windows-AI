name: windows-ai-agent-build
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-ai-agent/**'
      - '.github/workflows/windows-ai-agent-build.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: windows-ai-agent/package.json
      - name: Install deps
        run: npm ci
        working-directory: windows-ai-agent
      - name: Pack zip
        run: node scripts/pack-zip.js
        working-directory: windows-ai-agent
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-ai-agent
          path: windows-ai-agent/dist/windows-ai-agent.zip
