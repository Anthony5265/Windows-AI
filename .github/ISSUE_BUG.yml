name: Bug report
description: Report a reproducible problem in Windows-AI.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Windows-AI. Please provide the smallest useful reproduction and remove all secrets or private information before submitting.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and its user-visible impact.
      placeholder: Tell us what went wrong and what you were trying to accomplish.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Start Windows-AI...
        2. Open...
        3. Ask...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Windows-AI version or commit
      description: Include a release version or commit SHA when known.
      placeholder: e.g. main @ abc1234

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs, screenshots, or error messages
      description: Redact passwords, API keys, tokens, personal data, and other sensitive information.
      render: text

  - type: checkboxes
    id: safety
    attributes:
      label: Submission checks
      options:
        - label: I have removed passwords, API keys, tokens, and other secrets.
          required: true
        - label: I have searched for an existing issue describing the same problem.
          required: true
