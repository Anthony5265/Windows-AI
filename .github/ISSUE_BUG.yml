name: Bug report
description: Report a reproducible problem in Windows-AI.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide enough detail to reproduce and investigate it.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly and concisely.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence of steps.
      placeholder: |
        1. Start Windows-AI...
        2. Open...
        3. Ask...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Windows-AI version or commit
      placeholder: e.g. main @ abc1234

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove secrets, API keys, tokens, and other private information before posting.
      render: text

  - type: checkboxes
    id: safety
    attributes:
      label: Submission checks
      options:
        - label: I have removed passwords, API keys, tokens, and other secrets.
          required: true
        - label: I have searched for an existing issue describing the same problem.
          required: true
