# Docker Compose for Windows AI Development Environment

version: '3.9'

services:
  windows-ai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "8001:8001"
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - WINDOWS_AI_ENV=development
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./windows_ai:/app/windows_ai
      - ./marketplace:/app/marketplace
      - ./plugins:/app/plugins
      - ./config:/app/config
    networks:
      - windows-ai-network
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - windows-ai-network
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=windows_ai
      - POSTGRES_PASSWORD=dev_password
      - POSTGRES_DB=windows_ai
    ports:
      - "5432:5432"
    networks:
      - windows-ai-network
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - windows-ai-network
    volumes:
      - minio-data:/data

volumes:
  redis-data:
  postgres-data:
  minio-data:

networks:
  windows-ai-network:
    driver: bridge
