# Local container environment for Windows-AI services.
# Production deployments must provide secrets through an external secret store or environment.

services:
  windows-ai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "8001:8001"
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: "1"
      WINDOWS_AI_ENV: "development"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-windows_ai}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the stack}"
      POSTGRES_DB: "${POSTGRES_DB:-windows_ai}"
    volumes:
      - ./windows_ai:/app/windows_ai
      - ./marketplace:/app/marketplace
      - ./config:/app/config
    networks:
      - windows-ai-network
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - windows-ai-network
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-windows_ai}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the stack}"
      POSTGRES_DB: "${POSTGRES_DB:-windows_ai}"
    ports:
      - "5432:5432"
    networks:
      - windows-ai-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER before starting the stack}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD before starting the stack}"
    command: server /data --console-address ":9001"
    networks:
      - windows-ai-network
    volumes:
      - minio-data:/data

volumes:
  redis-data:
  postgres-data:
  minio-data:

networks:
  windows-ai-network:
    driver: bridge
