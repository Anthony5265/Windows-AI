openapi: 3.1.0
info:
  title: Windows AI Actions API
  version: 0.2.0
paths:
  /api/actions/execute:
    post:
      summary: Execute a system action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../codex/SCHEMAS/actions.request.schema.json
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: ../codex/SCHEMAS/actions.response.schema.json
  /api/mobile/pair:
    post:
      summary: Create a pairing token for a mobile device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
              required: [deviceId]
      responses:
        "200":
          description: Pairing token
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  token:
                    type: string
  /api/mobile/command:
    post:
      summary: Execute a command from a paired mobile device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                action:
                  type: string
                params:
                  type: object
      responses:
        "200":
          description: Action result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  result:
                    type: object
  /api/mesh/distribute:
    post:
      summary: Distribute a task to mesh nodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  type: string
              required: [task]
      responses:
        "200":
          description: Distribution acknowledgement
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  result:
                    type: object
                    properties:
                      distributed:
                        type: string
  /api/iot/event:
    post:
      summary: Handle an IoT device event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                event:
                  type: string
              required: [deviceId, event]
      responses:
        "200":
          description: Event acknowledgement
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  result:
                    type: object
                    properties:
                      deviceId:
                        type: string
                      event:
                        type: string
  /api/search/query:
    post:
      summary: Query a set of documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                documents:
                  type: object
                  additionalProperties:
                    type: string
              required: [query]
      responses:
        "200":
          description: Matching document ids
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  result:
                    type: array
                    items:
                      type: string
components:
  schemas:
    PluginMetadata:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        command:
          type: string
        paid:
          type: boolean
        metadata:
          type: object
          additionalProperties:
            type: string
        rating:
          type: number
        dependencies:
          type: array
          items:
            type: string
        signature:
          type: string
      required:
        - name
        - description
        - command
