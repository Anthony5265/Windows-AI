openapi: 3.1.0
info:
  title: Windows AI Actions API
  version: 0.1.0
paths:
  /api/actions/execute:
    post:
      summary: Execute a system action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string }
                params: { type: object }
                meta:
                  type: object
                  properties:
                    timeout_ms: { type: integer }
                    cwd: { type: string }
                    elevated: { type: boolean }
                    request_id: { type: string }
              required: [action]
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      ok: { const: true }
                      result: { type: object }
                      request_id: { type: string }
                  - type: object
                    properties:
                      ok: { const: false }
                      error:
                        type: object
                        properties:
                          code: { type: string }
                          message: { type: string }
                          hint: { type: string }
                      request_id: { type: string }
