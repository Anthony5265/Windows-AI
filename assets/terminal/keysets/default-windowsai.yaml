id: default-windowsai
name: Windows AI Default
bindings:
  - when: "terminalFocus"
    key: "Ctrl+Shift+T"
    action: "tab.new"
  - when: "terminalFocus"
    key: "Ctrl+Shift+W"
    action: "tab.close"
  - when: "terminalFocus"
    key: "Ctrl+Shift+D"
    action: "pane.splitRight"
  - when: "terminalFocus"
    key: "Ctrl+Shift+F"
    action: "find.open"
  - when: "terminalFocus"
    key: "Ctrl+Shift+P"
    action: "workflow.launcher"
  - when: "terminalFocus"
    key: "Ctrl+Shift+R"
    action: "workflow.run"
    args: { id: "system-info" }
