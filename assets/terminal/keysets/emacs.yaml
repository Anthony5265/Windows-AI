id: emacs
name: Emacs
bindings:
  - when: "terminalFocus"
    key: "Ctrl+A"
    action: "cursor.lineStart"
  - when: "terminalFocus"
    key: "Ctrl+E"
    action: "cursor.lineEnd"
  - when: "terminalFocus"
    key: "Ctrl+K"
    action: "line.killAfter"
  - when: "terminalFocus"
    key: "Ctrl+Y"
    action: "clipboard.paste"
  - when: "terminalFocus"
    key: "Ctrl+Shift+P"
    action: "workflow.launcher"
