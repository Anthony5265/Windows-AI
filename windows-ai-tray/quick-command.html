<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Windows AI Quick Command</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 16px;
      overflow: hidden;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: #667eea;
      font-weight: 600;
      font-size: 14px;
    }

    .icon {
      width: 20px;
      height: 20px;
    }

    .input-wrapper {
      position: relative;
    }

    #commandInput {
      width: 100%;
      padding: 12px 40px 12px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    #commandInput:focus {
      border-color: #667eea;
    }

    #commandInput::placeholder {
      color: #999;
    }

    .send-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: none;
      background: #667eea;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .send-btn:hover {
      background: #5568d3;
      transform: translateY(-50%) scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
      stroke: white;
      stroke-width: 2;
    }

    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #666;
      min-height: 18px;
    }

    .status.sending {
      color: #667eea;
    }

    .status.error {
      color: #ef4444;
    }

    .status.success {
      color: #10b981;
    }

    .hint {
      margin-top: 6px;
      font-size: 11px;
      color: #999;
      text-align: center;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .sending .send-btn {
      animation: pulse 1.5s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 16v-4M12 8h.01"/>
      </svg>
      <span>Quick Command</span>
    </div>

    <div class="input-wrapper">
      <input
        type="text"
        id="commandInput"
        placeholder="Ask me anything..."
        autofocus
        maxlength="500"
      />
      <button id="sendBtn" class="send-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

    <div id="status" class="status"></div>
    <div class="hint">Press Enter to send • Esc to close</div>
  </div>

  <script>
    const commandInput = document.getElementById('commandInput');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');
    const container = document.querySelector('.container');

    let isSending = false;

    // Focus input on load
    setTimeout(() => commandInput.focus(), 100);

    // Send command
    async function sendCommand() {
      const command = commandInput.value.trim();
      if (!command || isSending) return;

      isSending = true;
      sendBtn.disabled = true;
      container.classList.add('sending');
      status.textContent = 'Sending to AI...';
      status.className = 'status sending';

      try {
        const result = await window.quickCommandAPI.sendCommand(command);

        if (result.success) {
          status.textContent = '✓ Sent! Check notifications for response.';
          status.className = 'status success';

          // Clear and close after a short delay
          setTimeout(() => {
            commandInput.value = '';
            window.quickCommandAPI.hideWindow();
          }, 1500);
        } else {
          status.textContent = `Error: ${result.error}`;
          status.className = 'status error';
        }
      } catch (error) {
        status.textContent = `Error: ${error.message}`;
        status.className = 'status error';
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        container.classList.remove('sending');
      }
    }

    // Event listeners
    sendBtn.addEventListener('click', sendCommand);

    commandInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendCommand();
      } else if (e.key === 'Escape') {
        window.quickCommandAPI.hideWindow();
      }
    });

    // Enable/disable send button
    commandInput.addEventListener('input', () => {
      sendBtn.disabled = !commandInput.value.trim() || isSending;
    });

    // Clear status on input
    commandInput.addEventListener('input', () => {
      if (status.className.includes('error') || status.className.includes('success')) {
        status.textContent = '';
        status.className = 'status';
      }
    });

    // Initial state
    sendBtn.disabled = true;
  </script>
</body>
</html>
