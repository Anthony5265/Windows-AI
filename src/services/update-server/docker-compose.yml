version: '3.8'

services:
  update-server:
    build:
      context: ..
      dockerfile: update-server/Dockerfile
    container_name: windows-ai-update-server
    ports:
      - "8011:8011"
    volumes:
      - ./downloads:/app/update-server/downloads:ro
      - ./manifest.json:/app/update-server/manifest.json:ro
    environment:
      - BASE_URL=https://updates.windows-ai.example.com
      - LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - update-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    container_name: windows-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./downloads:/var/www/downloads:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - update-server
    restart: unless-stopped
    networks:
      - update-network

networks:
  update-network:
    driver: bridge
