name: build-agent
on:
  push:
    paths:
      - "windows-ai-agent/**"
      - ".github/workflows/build-agent.yml"
  workflow_dispatch:

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          cd windows-ai-agent
          npm ci || npm i
      - name: Lint
        run: |
          cd windows-ai-agent
          npm run lint --if-present
      - name: Test
        run: |
          cd windows-ai-agent
          npm test --if-present
      - name: Package
        run: |
          cd windows-ai-agent
          mkdir -p dist
          tar -czf dist/windows-ai-agent.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-ai-agent
          path: windows-ai-agent/dist/windows-ai-agent.tar.gz
